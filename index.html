---
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按图片原始宽高比展示、支持主题筛选与大图查看的个人摄影档案。">
  <title>Jienice · 图像档案</title>
  <link rel="icon" href="public/favicon.svg">
  <style>
    :root {
      --bg: oklch(84.52% 0 89.88);
      --surface: oklch(100% 0 89.88);
      --fg: oklch(30.12% 0 89.88);
      --muted: oklch(60.66% 0 89.88);
      --border: oklch(91.89% 0 89.88);
      --accent: oklch(0% 0 0);
      --nav-surface: oklch(95.5% 0 89.88);
      --subtle: oklch(73% 0 89.88);
      --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; font-weight: 400; line-height: 1.55; }
    body.viewer-open { overflow: hidden; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    .site-shell { position: relative; display: block; width: min(1240px, calc(100% - 48px)); min-height: 100vh; margin: 0 auto; background: var(--surface); box-shadow: 0 0 0 1px color-mix(in oklch, var(--fg) 8%, transparent); }
    .content { min-width: 0; padding: 72px clamp(28px, 5vw, 74px) 44px; }
    h2 { font-family: var(--font-display); }

    .archive-controls { padding: 8px 0 40px; }
    .year-filter { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 4px; }
    .year-filter button { min-height: 44px; padding: 0 13px; color: var(--muted); background: transparent; border: 0; border-bottom: 1px solid transparent; cursor: pointer; font-size: 13px; letter-spacing: .02em; }
    .year-filter button:hover, .year-filter button:focus-visible { color: var(--fg); }
    .year-filter button.selected { color: var(--fg); border-bottom-color: var(--accent); }
    .year-filter button:focus-visible,
    .empty-state button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .archive-grid { --column-count: 4; --column-gap: clamp(11px, 1.5vw, 22px); --row-gap: clamp(28px, 3vw, 44px); display: grid; grid-template-columns: repeat(var(--column-count), minmax(0, 1fr)); column-gap: var(--column-gap); align-items: start; }
    .archive-column { display: flex; min-width: 0; flex-direction: column; gap: var(--row-gap); }
    .archive-card { display: block; width: 100%; margin: 0; text-align: center; }
    .image-button { position: relative; display: block; width: 100%; min-height: 0; padding: 0; overflow: hidden; background: var(--nav-surface); border: 0; cursor: zoom-in; }
    .image-button img { display: block; width: 100%; height: auto; object-fit: contain; opacity: 1; transform: none; filter: none; transition: transform 160ms cubic-bezier(.2,0,0,1); }
    .archive-card:hover .image-button img, .image-button:focus-visible img { transform: scale(1.035); }
    .image-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .image-button.is-error { cursor: default; }
    .image-button.is-error img { display: none; }
    .image-button.is-error::after { content: attr(data-error); display: grid; min-height: 96px; place-items: center; padding: 20px; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
    .card-copy { padding-top: 13px; text-align: left; }
    .card-copy p { margin: 0; color: var(--subtle); font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; }

    .empty-state { padding: 90px 20px; text-align: center; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .empty-state h2 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: -.01em; }
    .empty-state p { color: var(--muted); }
    .empty-state button { min-height: 44px; padding: 0 18px; color: var(--surface); background: var(--accent); border: 0; cursor: pointer; letter-spacing: .02em; }
    .archive-footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 90px; padding-top: 22px; border-top: 1px solid var(--border); color: var(--subtle); font-size: 10px; letter-spacing: .08em; }

    .viewer-backdrop { position: fixed; z-index: 30; inset: 0; display: grid; place-items: center; padding: 24px; background: color-mix(in oklch, var(--fg) 84%, transparent); }
    .viewer { position: relative; display: block; width: min(900px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; padding: 38px; background: var(--surface); box-shadow: 0 28px 90px color-mix(in oklch, var(--accent) 32%, transparent); }
    .viewer-image-wrap { display: grid; place-items: center; min-height: 420px; overflow: hidden; background: #fff; }
    .viewer-image-wrap img { display: block; width: auto; max-width: 100%; height: auto; max-height: calc(100vh - 190px); object-fit: contain; image-rendering: auto; }
    .viewer-caption { padding-top: 16px; text-align: left; }
    .viewer-caption p { margin: 0; color: var(--muted); font-family: var(--font-mono); font-size: 11px; line-height: 1.7; }

    @media (max-width: 980px) {
      .site-shell { width: min(100% - 24px, 980px); }
      .content { padding-inline: 34px; }
      .archive-grid { --column-count: 3; }
    }
    @media (max-width: 700px) {
      html, body { background: var(--surface); }
      .site-shell { display: block; width: 100%; box-shadow: none; }
      .content { padding: 36px 20px 34px; }
      .archive-controls { padding: 8px 0 34px; }
      .year-filter { gap: 4px; }
      .year-filter button { flex: 0 0 auto; padding-inline: 10px; }
      .archive-grid { --column-count: 2; --column-gap: 11px; --row-gap: 34px; }
      .archive-footer { display: block; margin-top: 70px; }
      .viewer { padding: 56px 20px 22px; }
      .viewer-image-wrap { min-height: 320px; }
      .viewer-image-wrap img { max-height: calc(100vh - 210px); }
    }
    @media (max-width: 390px) {
      .content { padding-inline: 16px; }
      .archive-grid { --column-gap: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .image-button img,
      .archive-card:hover .image-button img,
      .image-button:focus-visible img { transform: none; }
    }
  </style>
</head>
<body>
  <main class="site-shell" data-od-id="image-archive-page">
    <section class="content" id="archive" data-od-id="archive-content">
      <div class="archive-controls" id="search" data-od-id="archive-controls">
        <div class="year-filter" id="year-filter" role="group" aria-label="按年份筛选"></div>
      </div>

      <div class="archive-grid" id="archive-grid" data-od-id="archive-grid"></div>
      <div class="empty-state" id="empty-state" data-od-id="empty-search-state" hidden>
        <h2>没有匹配的档案</h2>
        <p>选择“全部”以查看完整档案。</p>
        <button id="clear-filter" type="button">清除筛选</button>
      </div>

      <footer id="footer" class="archive-footer" data-od-id="archive-footer">
        <p>JIENICE · PHOTOGRAPHIC ARCHIVE</p>
        <p>个人摄影档案 · 影像版权归本站作者所有</p>
      </footer>
    </section>
  </main>

  <div class="viewer-backdrop" id="viewer-backdrop" role="presentation" hidden>
    <section class="viewer" role="dialog" aria-modal="true" aria-describedby="viewer-meta" tabindex="-1" data-od-id="image-viewer">
      <div class="viewer-image-wrap"><img id="viewer-image" src="" alt=""></div>
      <div class="viewer-caption" id="viewer-meta"><p id="viewer-tags"></p><p id="viewer-date"></p></div>
    </section>
  </div>

  <script>
    {% assign image_extensions = ".jpg,.jpeg,.png,.webp,.avif" | split: "," %}
    {% assign archive_files = site.static_files | sort: "path" %}
    const archiveFiles = [
      {% for file in archive_files %}
        {% assign extension = file.extname | downcase %}
        {% if file.path contains "/public/archive/" and image_extensions contains extension %}
          {
            name: {{ file.basename | jsonify }},
            src: {{ file.path | relative_url | jsonify }},
            path: {{ file.path | jsonify }},
            modified: {{ file.modified_time | date: "%Y-%m-%d" | jsonify }}
          },
        {% endif %}
      {% endfor %}
    ];

    function titleFromFilename(filename) {
      return filename.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim() || "未命名影像";
    }

    function parseArchiveFilename(filename, fallbackDate = "未标注日期") {
      const normalizedFallbackDate = fallbackDate.replace(/\./g, "-");
      const fullDateMatch = filename.match(/^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])-(.+)$/);
      const monthMatch = fullDateMatch ? null : filename.match(/^(\d{4})-(0[1-9]|1[0-2])-(.+)$/);
      const remainder = fullDateMatch?.[4] || monthMatch?.[3] || filename;
      const segments = remainder.split("-").map((segment) => segment.trim()).filter(Boolean);
      const identifier = titleFromFilename(segments.pop() || filename);
      const tags = [...new Set(segments.map(titleFromFilename).filter(Boolean))];
      const resolvedTags = tags.length ? tags : [identifier];
      const title = resolvedTags.join(" ");

      if (fullDateMatch) {
        const date = `${fullDateMatch[1]}-${fullDateMatch[2]}-${fullDateMatch[3]}`;
        return { title, date, month: date.slice(0, 7), tags: resolvedTags };
      }

      if (monthMatch) {
        const month = `${monthMatch[1]}-${monthMatch[2]}`;
        return { title, date: month, month, tags: resolvedTags };
      }

      const fallbackMonth = normalizedFallbackDate.match(/^\d{4}-\d{2}/)?.[0] || normalizedFallbackDate;
      return { title, date: normalizedFallbackDate, month: fallbackMonth, tags: resolvedTags };
    }

    const archive = archiveFiles.map((file, index) => {
      const slug = file.name.toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
      const parsed = parseArchiveFilename(file.name, file.modified || "未标注日期");
      return {
        slug: slug || `archive-${index + 1}`,
        title: parsed.title,
        date: parsed.date,
        month: parsed.month,
        year: parsed.date.match(/^\d{4}/)?.[0] || "未标注",
        tags: parsed.tags,
        src: file.src,
        width: null,
        height: null
      };
    });
    const archiveYears = ["全部", ...new Set(archive.map((item) => item.year).sort((a, b) => b.localeCompare(a, "zh-CN")))];
    const state = { year: "全部" };
    const grid = document.querySelector("#archive-grid");
    const emptyState = document.querySelector("#empty-state");
    const yearFilter = document.querySelector("#year-filter");
    const siteShell = document.querySelector(".site-shell");
    const viewerBackdrop = document.querySelector("#viewer-backdrop");
    const viewer = document.querySelector(".viewer");
    const viewerImage = document.querySelector("#viewer-image");
    const viewerTags = document.querySelector("#viewer-tags");
    const viewerDate = document.querySelector("#viewer-date");
    let previousFocus = null;

    function renderYears() {
      yearFilter.replaceChildren(...archiveYears.map((year) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = year;
        button.className = state.year === year ? "selected" : "";
        button.setAttribute("aria-pressed", String(state.year === year));
        button.addEventListener("click", () => { state.year = year; render(); });
        return button;
      }));
    }

    function filteredItems() {
      return archive.filter((item) => state.year === "全部" || item.year === state.year);
    }

    function createCard(item, index) {
      const article = document.createElement("article");
      article.className = "archive-card";
      article.dataset.odId = `archive-card-${item.slug}`;
      article.dataset.archiveIndex = String(index);
      const button = document.createElement("button");
      button.className = "image-button";
      button.type = "button";
      button.setAttribute("aria-label", `查看${item.title}摄影作品`);
      button.dataset.error = "图片暂不可用";
      button.addEventListener("click", () => openViewer(item));
      const image = document.createElement("img");
      image.src = item.src;
      if (item.width && item.height) {
        image.width = item.width;
        image.height = item.height;
      }
      image.alt = `${item.title}摄影作品`;
      image.addEventListener("error", () => {
        button.classList.add("is-error");
        button.disabled = true;
        button.setAttribute("aria-label", `${item.title}图片暂不可用`);
      }, { once: true });
      button.append(image);
      const copy = document.createElement("div");
      copy.className = "card-copy";
      const month = document.createElement("p");
      month.textContent = item.month;
      copy.append(month);
      article.append(button, copy);
      return article;
    }

    function getColumnCount() {
      return Number.parseInt(getComputedStyle(grid).getPropertyValue("--column-count"), 10) || 1;
    }

    function renderCards(items) {
      const columnCount = getColumnCount();
      const columns = Array.from({ length: columnCount }, () => {
        const column = document.createElement("div");
        column.className = "archive-column";
        return column;
      });

      items.forEach((item, index) => {
        columns[index % columnCount].append(createCard(item, index));
      });
      grid.replaceChildren(...columns);
      return columnCount;
    }

    let renderedColumnCount = 0;

    function render() {
      renderYears();
      const items = filteredItems();
      renderedColumnCount = renderCards(items);
      grid.hidden = items.length === 0;
      emptyState.hidden = items.length !== 0;
    }

    function openViewer(item) {
      previousFocus = document.activeElement;
      viewerImage.src = item.src;
      if (item.width && item.height) {
        viewerImage.width = item.width;
        viewerImage.height = item.height;
      } else {
        viewerImage.removeAttribute("width");
        viewerImage.removeAttribute("height");
      }
      viewerImage.alt = `${item.title}摄影作品大图`;
      viewerTags.textContent = item.tags.map((tag) => `#${tag}`).join(" ");
      viewerDate.textContent = item.date;
      viewerBackdrop.hidden = false;
      document.body.classList.add("viewer-open");
      siteShell.inert = true;
      viewer.focus();
    }

    function closeViewer() {
      viewerBackdrop.hidden = true;
      document.body.classList.remove("viewer-open");
      siteShell.inert = false;
      if (previousFocus instanceof HTMLElement && previousFocus.isConnected) previousFocus.focus();
    }

    document.querySelector("#clear-filter").addEventListener("click", () => {
      state.year = "全部";
      render();
    });
    viewerBackdrop.addEventListener("mousedown", (event) => { if (event.target === viewerBackdrop) closeViewer(); });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !viewerBackdrop.hidden) closeViewer();
    });
    let resizeFrame = 0;
    window.addEventListener("resize", () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        if (getColumnCount() !== renderedColumnCount) render();
      });
    });
    render();
  </script>
</body>
</html>
